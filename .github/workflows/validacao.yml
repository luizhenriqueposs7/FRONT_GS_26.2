name: Validar POC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements-backend.txt -r requirements-frontend.txt
      - name: Executar testes
        run: python -m pytest -v --junitxml=docs/evidencias/testes-ci.xml

  docker:
    runs-on: ubuntu-latest
    env:
      MANAGER_API_KEY: chave-sintetica-apenas-do-smoke-test-ci
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Construir e subir serviços
        run: docker compose up -d --build --wait
      - name: Conferir API e interface
        run: |
          curl --fail http://localhost:8000/health
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8501/_stcore/health
      - name: Mostrar diagnóstico e encerrar
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v
